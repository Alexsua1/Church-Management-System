{% extends "base/dashboard_base.html" %}
{% block page_title %}Delete Member{% endblock %}
{% block content %}
<div class="card p-4">
  <p>Are you sure you want to delete <strong>{{ member.full_name }}</strong>?</p>
  <form method="post">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Yes, Delete</button>
    <a href="{% url 'members:detail' member.pk %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
