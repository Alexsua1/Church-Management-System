{% extends "base/dashboard_base.html" %}
{% block page_title %}{{ department.name }}{% endblock %}
{% block content %}
<div class="card p-4">
  <h5>{{ department.name }}</h5>
  <p>{{ department.description }}</p>
  <p><strong>Leader:</strong> {{ department.leader_name }} ({{ department.leader_phone }})</p>
  <p><strong>Members:</strong> {{ department.members.count }}</p>
</div>
{% endblock %}
