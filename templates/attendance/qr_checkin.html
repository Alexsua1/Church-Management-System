{% extends "base/public_base.html" %}
{% block content %}
<div class="container py-5 text-center">
  <h3>Attendance Check-In</h3>
  <p class="text-muted">{{ session.get_session_type_display }} — {{ session.date }}</p>
  <p>Scan your member QR code or enter your Membership ID below.</p>
  <form id="checkinForm" class="col-md-4 mx-auto">
    <input type="text" id="membership_id" class="form-control mb-3" placeholder="Membership ID">
    <button type="submit" class="btn btn-navy w-100">Check In</button>
  </form>
  <p id="result" class="mt-3 fw-bold"></p>
</div>
<script>
document.getElementById('checkinForm').addEventListener('submit', function(e){
  e.preventDefault();
  fetch(window.location.href, {
    method: 'POST',
    headers: {'X-Requested-With': 'XMLHttpRequest'},
    body: new URLSearchParams({membership_id: document.getElementById('membership_id').value})
  }).then(r => r.json()).then(data => {
    document.getElementById('result').innerText = data.message;
  });
});
</script>
{% endblock %}
